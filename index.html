<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Protótipo Escalas CEUMA</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,400;0,600;0,700;1,400&display=swap">

  <!-- Estilos gerais primeiro; depois os de cada aba. -->
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/painel.css">
  <link rel="stylesheet" href="css/escalas.css">
  <link rel="stylesheet" href="css/cadastros.css">
  <link rel="stylesheet" href="css/relacoes.css">
</head>
<body>
  <header class="topo">
    <div class="topo-in">
      <img src="" alt="Logo do CEUMA" class="logo">
      <h1>Estágios de Medicina</h1>
      <p id="contexto"></p> <!-- preenchido pelo js/app.js com o curso: "Medicina · Internato" -->
      <p class="nota">Protótipo com dados fictícios</p>
    </div>
    <nav class="abas" id="abas" role="tablist" aria-label="Seções"></nav>
  </header>

  <main>
    <div id="conteudo"></div> <!-- a aba aberta é desenhada aqui -->
  </main>

  <footer class="rodape">
    <span>Nomes, CPFs e contatos são fictícios. As alterações ficam salvas só neste navegador.</span>
    <button type="button" class="link" data-acao="restaurar">Restaurar dados de exemplo</button>
  </footer>

  <div id="gaveta"></div> <!-- painel lateral (turno da escala ou ficha do preceptor) -->

  <!-- type="module" deixa o app.js importar os outros arquivos. Por isso a página precisa de um
       servidor local (Live Server, por exemplo): aberta direto do disco, o navegador bloqueia os imports. -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
